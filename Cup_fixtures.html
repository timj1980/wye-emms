<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cup Fixtures</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<h1>Cup Fixtures</h1>
<h2 id="TeamHeading"></h2>

<table id="fixturesTable">
  <thead>
    <tr>
      <th>Date</th>
      <th>Home/Away</th>
      <th>Alley</th>
      <th>Opposition</th>
      <th>Cup</th>
      <th>Round</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script type="module">
  import { supabase } from "./supabase.js";

  const cupId = 14; // Sharks cup ID

  const { data: cups, error } = await supabase.rpc(
    "get_team_cup_fixtures",
    {
      team_id: cupId,
      season: "2026/27"
    }
  );

  if (error) {
    console.error("Cup RPC error:", error);
  }

  const tbody = document.querySelector("#fixturesTable tbody");
  tbody.innerHTML = "";

  cups.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row.game_date}</td>
      <td>${row.home_away}</td>
      <td>${row.alley}</td>
      <td>${row.opposition}</td>
      <td>${row.cup_type}</td>
      <td>${row.cup_round}</td>
    `;
    tbody.appendChild(tr);
  });
</script>

</body>
</html>
