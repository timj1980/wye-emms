<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Match Viewer</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    body { font-family: Arial; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    th { background: #eee; }
    select { padding: 6px; font-size: 16px; margin-bottom: 20px; }
    h2 { margin-top: 30px; }
    .spare_cell { background: #ffeb3b; font-weight: bold; }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<script>
  fetch("Nav.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("nav-placeholder").innerHTML = html;
      initNav();
    });

  function initNav() {
    const page = window.location.pathname.split("/").pop().toLowerCase();
    document.querySelectorAll(".gh-tabs a").forEach(link => {
      if (link.getAttribute("href").toLowerCase().includes(page)) {
        link.classList.add("active");
      }
    });
  }
</script>

<h1 id="pageTitle">Match Viewer</h1>

<label><strong>Select Match:</strong></label>
<select id="matchSelect"></select>

<table id="matchTable">
  <thead>
    <tr>
      <th colspan="10"><div id="HomeTeam"></div></th>
      <th colspan="10"><div id="AwayTeam"></div></th>
    </tr>
    <tr>
      <th>Home Player</th>
      <th colspan="8">Home Balls</th>
      <th>Total</th>
      <th>Away Player</th>
      <th colspan="8">Away Balls</th>
      <th>Total</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div id="totals"></div>

<script type="module">
  import { supabase } from "./supabase.js";

  // Highlight spare balls
  function highlightCell(score) {
    return score > 9
      ? `<td class="spare_cell">${score}</td>`
      : `<td>${score}</td>`;
  }

  // Convert "Wednesday 09-09-2026" → "2026-09-09"
  function normaliseDate(str) {
  // Extract the DD-MM-YYYY part reliably
  const dmy = str.match(/\d{1,2}-\d{1,2}-\d{4}/)[0];

  let [dd, mm, yyyy] = dmy.split("-");

  // Pad single digits
  if (dd.length === 1) dd = "0" + dd;
  if (mm.length === 1) mm = "0" + mm;

  return `${yyyy}-${mm}-${dd}`;
}

  // Flexible URL parsing
  const params = new URLSearchParams(window.location.search);

  let teamName = params.get("team");

  if (!teamName) {
    const firstKey = [...params.keys()][0];
    if (firstKey && firstKey.toLowerCase() !== "team") {
      teamName = firstKey;
    }
  }

  teamName = teamName || "Sharks";

  document.getElementById("pageTitle").innerText = `${teamName} – Match Viewer`;

  async function loadMatches() {
  const { data: fixtures, error: fxErr } = await supabase.rpc(
    "tmsl_get_allfixtures",
    { team: teamName }
  );

  if (fxErr) {
    console.error(fxErr);
    return;
  }

  const matchSelect = document.getElementById("matchSelect");

  // Filter played matches
  const today = new Date();
  const playedMatches = fixtures.filter(fx => {
    const fixedDate = normaliseDate(fx.game_date);
    return new Date(fixedDate) <= today;
  });

  // Sort descending (most recent match first)
  playedMatches.sort((a, b) => {
    return new Date(normaliseDate(b.game_date)) - new Date(normaliseDate(a.game_date));
  });

  // Populate select dropdown
  playedMatches.forEach(fx => {
    const fixedDate = normaliseDate(fx.game_date);
    const opt = document.createElement("option");
    opt.value = fixedDate;
    opt.textContent = `${fx.game_date} – ${fx.home_away} vs ${fx.opposition}`;
    matchSelect.appendChild(opt);
  });

  // Load the top (most recent) match automatically
  if (matchSelect.options.length > 0) {
    matchSelect.selectedIndex = 0;
    loadMatchTable(matchSelect.options[0].value);
  }

  matchSelect.addEventListener("change", () => {
    loadMatchTable(matchSelect.value);
  });
}


  async function loadMatchTable(selectedDate) {

    console.log("DEBUG → Calling RPC tmsl_get_match_scores with:", {
  team_namein: teamName,
  game_date: selectedDate
});
    const { data: rows, error } = await supabase.rpc(
      "tmsl_get_match_scores",
      {  team_namein: teamName, game_date: selectedDate}
    );

    if (error) {
      console.error(error);
      return;
    }

    const tbody = document.querySelector("#matchTable tbody");
    tbody.innerHTML = "";

    if (!rows || rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="20">No match data found.</td></tr>`;
      return;
    }

    const homeTeamName = rows[0].home_team_name;
    const awayTeamName = rows[0].away_team_name;

    document.getElementById("HomeTeam").innerText = homeTeamName;
    document.getElementById("AwayTeam").innerText = awayTeamName;

    let frontHome = 0, frontAway = 0;
    let middleHome = 0, middleAway = 0;
    let backHome = 0, backAway = 0;

    rows.forEach(row => {

      const homeBalls = [
        row.home_ball1, row.home_ball2, row.home_ball3, row.home_ball4,
        row.home_ball5, row.home_ball6, row.home_ball7, row.home_ball8
      ];

      const awayBalls = [
        row.away_ball1, row.away_ball2, row.away_ball3, row.away_ball4,
        row.away_ball5, row.away_ball6, row.away_ball7, row.away_ball8
      ];

      const homeTotal = homeBalls.reduce((a,b) => a+b, 0);
      const awayTotal = awayBalls.reduce((a,b) => a+b, 0);

      if (row.hand === "Front") {
        frontHome += homeTotal;
        frontAway += awayTotal;
      }
      if (row.hand === "Middle") {
        middleHome += homeTotal;
        middleAway += awayTotal;
      }
      if (row.hand === "Back") {
        backHome += homeTotal;
        backAway += awayTotal;
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
  	
	  <td>${row.home_player}</td>
	  ${homeBalls.map(b => highlightCell(b)).join("")}
	  <td><strong>${homeTotal}</strong></td>
         <td>${row.away_player}</td>
 	 ${awayBalls.map(b => highlightCell(b)).join("")}
 	 <td><strong>${awayTotal}</strong></td>
	`;

      tbody.appendChild(tr);
    });

    const matchHome = frontHome + middleHome + backHome;
    const matchAway = frontAway + middleAway + backAway;

    let homePoints = 0;
    let awayPoints = 0;

    if (frontHome > frontAway) homePoints += 2;
    else if (frontAway > frontHome) awayPoints += 2;

    if (middleHome > middleAway) homePoints += 2;
    else if (middleAway > middleHome) awayPoints += 2;

    if (backHome > backAway) homePoints += 2;
    else if (backAway > backHome) awayPoints += 2;

    if (matchHome > matchAway) homePoints += 4;
    else if (matchAway > matchHome) awayPoints += 4;

    const totalsDiv = document.getElementById("totals");
    totalsDiv.innerHTML = `
      <h2>Hand Totals</h2>
      <table>
        <tr><th>Hand</th><th>${homeTeamName}</th><th>${awayTeamName}</th></tr>
        <tr><td>Front</td><td>${frontHome}</td><td>${frontAway}</td></tr>
        <tr><td>Middle</td><td>${middleHome}</td><td>${middleAway}</td></tr>
        <tr><td>Back</td><td>${backHome}</td><td>${backAway}</td></tr>
      </table>

      <h2>Match Total</h2>
      <table>
        <tr><th>${homeTeamName}</th><th>${awayTeamName}</th></tr>
        <tr><td>${matchHome}</td><td>${matchAway}</td></tr>
      </table>

      <h2>Points Awarded</h2>
      <table>
        <tr><th>Team</th><th>Points</th></tr>
        <tr><td>${homeTeamName}</td><td>${homePoints}</td></tr>
        <tr><td>${awayTeamName}</td><td>${awayPoints}</td></tr>
      </table>
    `;
  }

  loadMatches();
</script>

</body>
</html>
